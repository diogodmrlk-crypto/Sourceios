name: Build Unsigned IPA (Sourceios)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Patch Kernel Placeholder Offsets
      run: |
        find . \( -name "*.c" -o -name "*.h" -o -name "*.m" -o -name "*.mm" \) -not -path "./.git/*" | while read f; do
          sed -i '' -E 's|0x/\*|0x0 /*|g' "$f"
        done

    - name: Patch Missing @end in Objective-C files
      run: |
        find . -name "*.m" -not -path "./.git/*" | while read f; do
          IMPL=$(grep -c '^[[:space:]]*@implementation' "$f" || true)
          END=$(grep -c '^[[:space:]]*@end' "$f" || true)
          IMPL=${IMPL:-0}; END=${END:-0}
          if [ "$IMPL" -gt "$END" ]; then
            DIFF=$((IMPL - END))
            for i in $(seq 1 $DIFF); do
              printf '\n@end\n' >> "$f"
            done
          fi
        done

    - name: Create Kernel Stubs
      run: |
        if [ ! -f Kernel/KernelStubs.c ]; then
          cat > Kernel/KernelStubs.c << 'EOF'
        #include <stdint.h>
        #include <stddef.h>

        int kwrite32(uint64_t where, uint32_t what) { (void)where; (void)what; return 0; }
        int kwrite64(uint64_t where, uint64_t what) { (void)where; (void)what; return 0; }
        EOF
        fi

    # Sobrescreve o RootViewController.m com uma UI funcional e stubs completos
    - name: Force UI in RootViewController
      run: |
        mkdir -p UI
        cat > UI/RootViewController.m << 'EOF'
        #import "RootViewController.h"

        @interface RootViewController () <UITableViewDelegate, UITableViewDataSource>
        @property (nonatomic, strong) UITableView *tableView;
        @property (nonatomic, strong) NSArray *items;
        @end

        @implementation RootViewController

        - (void)viewDidLoad {
            [super viewDidLoad];
            self.title = @"Dash iOS";
            self.view.backgroundColor = [UIColor blackColor];
            self.items = @[@"Exploit", @"No Exploit (Safe)", @"Misc", @"Account", @"Settings"];
            self.tableView = [[UITableView alloc] initWithFrame:self.view.bounds style:UITableViewStyleGrouped];
            self.tableView.backgroundColor = [UIColor clearColor];
            self.tableView.delegate = self;
            self.tableView.dataSource = self;
            self.tableView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
            [self.view addSubview:self.tableView];
        }

        - (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView { return 1; }
        - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section { return self.items.count; }

        - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
            static NSString *cellId = @"Cell";
            UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:cellId];
            if (!cell) {
                cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:cellId];
            }
            cell.textLabel.text = self.items[indexPath.row];
            cell.textLabel.textColor = [UIColor whiteColor];
            cell.backgroundColor = [UIColor darkGrayColor];
            cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
            return cell;
        }

        - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
            [tableView deselectRowAtIndexPath:indexPath animated:YES];
            UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Info" message:[NSString stringWithFormat:@"Voce clicou em %@", self.items[indexPath.row]] preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
            [self presentViewController:alert animated:YES completion:nil];
        }

        // Stubs para as declaracoes do .h original
        - (void)configureButtonLayout:(id)sender {}
        - (void)toggleLightTheme {}
        - (void)traitCollectionDidChange:(UITraitCollection *)previousTraitCollection {}
        - (void)viewDidLayoutSubviews {}
        - (NSString *)L:(NSString *)key { return key; }
        - (NSString *)hardwareModel { return @"iPhone"; }
        - (NSString *)commercialDeviceName { return @"iPhone"; }
        - (void)buildDeviceRowsInCard:(UIView *)card width:(CGFloat)width {}
        - (void)refreshDeviceValues {}
        - (void)openSettingsSheet {}
        - (NSString *)stringFromAPIValue:(id)val fallback:(NSString *)fb { return fb ?: @""; }
        - (void)refreshAPIAccountValues {}
        - (UIView *)visibleMainPage { return self.view; }
        - (void)animateToMainPage:(UIView *)targetPage {}
        - (void)tabExploitPressed {}
        - (void)tabNoExploitPressed {}
        - (void)tabMiscPressed {}
        - (void)tabAccountPressed {}
        - (void)setTabActive:(UIButton *)activeBtn inactive:(UIButton *)inactiveBtn {}
        - (NSAttributedString *)injectorAttributedTitle:(NSString *)title subtitle:(NSString *)sub selected:(BOOL)sel { return nil; }
        - (void)styleOptionChip:(UIButton *)chip selected:(BOOL)sel {}
        - (void)applyInjectorTabAppearance {}
        - (void)applyGameTabAppearance {}
        - (void)selectNoExpFF {}
        - (void)selectNoExpFFMax {}
        - (void)animateTable:(UITableView *)tv goingToMax:(BOOL)isMax reload:(BOOL)reload {}
        - (NSArray *)visibleFunctionRows { return @[]; }
        - (NSString *)currentBundleIDForTable:(UITableView *)tv { return @""; }
        - (NSString *)backupRoot { return @""; }
        - (BOOL)isTexturePayloadRow:(NSInteger)row { return NO; }
        - (NSInteger)textureIndexForPayloadRow:(NSInteger)row { return 0; }
        - (NSString *)textureFolderNameAtIndex:(NSInteger)index { return @""; }
        - (NSString *)textureCDNPath:(NSString *)folder file:(NSString *)file { return @""; }
        - (NSURL *)texturePreviewURLAtIndex:(NSInteger)index { return nil; }
        - (NSURL *)texturePayloadURLAtIndex:(NSInteger)index { return nil; }
        - (BOOL)isInj2AssetindexerRow:(NSInteger)row { return NO; }
        - (NSData *)embeddedPayloadDataForRow:(NSInteger)row { return nil; }
        - (NSString *)payloadCachePathForRow:(NSInteger)row bundleID:(NSString *)bundleID { return @""; }
        - (void)loadPayloadFromURLString:(NSString *)urlStr completion:(void (^)(NSData *data, NSError *error))completion {}
        - (BOOL)injectData:(NSData *)data forBundleID:(NSString *)bundleID relativePath:(NSString *)relPath error:(NSError **)error { return NO; }
        - (BOOL)deleteDataForBundleID:(NSString *)bundleID relativePath:(NSString *)relPath error:(NSError **)error { return NO; }
        - (BOOL)ensureKernelReady:(NSError **)error { return NO; }
        - (void)askAimAssistBoxThenActivate:(NSInteger)row injector1:(BOOL)inj1 {}
        - (void)deactivateAimAssist:(NSInteger)row {}
        - (void)miscSwitchChanged:(UISwitch *)sender {}
        - (void)askAntennaThenInjectRow:(NSInteger)row sender:(UISwitch *)sender {}
        - (void)performInj2InjectRow:(NSInteger)row sender:(UISwitch *)sender {}
        - (void)switchChanged:(UISwitch *)sender {}
        - (void)inj1SwitchChanged:(UISwitch *)sender {}
        - (void)textureSwitchChanged:(UISwitch *)sender {}
        - (void)resetToggles {}
        - (UIImage *)emojiImage:(NSString *)emoji size:(CGSize)size { return nil; }
        - (UIImage *)textureThumbPlaceholder { return nil; }
        - (UIImage *)resizedTextureThumb:(UIImage *)img { return img; }
        - (void)bindTextureThumbAtIndex:(NSInteger)index toImageView:(UIImageView *)iv {}
        - (void)applyLanguage {}
        - (void)startAPIAuthentication {}
        - (void)selectInjector1 {}
        - (void)selectInjector2 {}
        - (void)selectExpFF {}
        - (void)selectExpFFMax {}
        - (void)toggleExploitStart {}
        - (NSString *)backupPathForBundleID:(NSString *)bundleID row:(NSInteger)row { return @""; }
        - (NSString *)targetRelativePathForRow:(NSInteger)row bundleID:(NSString *)bundleID { return @""; }
        - (NSURL *)payloadURLForRow:(NSInteger)row bundleID:(NSString *)bundleID { return nil; }
        - (void)loadPayloadForRow:(NSInteger)row bundleID:(NSString *)bundleID completion:(void (^)(NSData *data, NSError *error))completion {}
        - (BOOL)_writePayload:(NSData *)data toBundleID:(NSString *)bundleID relativePath:(NSString *)relPath error:(NSError **)error { return NO; }
        - (BOOL)injectPayload:(NSData *)data forBundleID:(NSString *)bundleID row:(NSInteger)row error:(NSError **)error { return NO; }
        - (BOOL)restorePayloadForBundleID:(NSString *)bundleID row:(NSInteger)row error:(NSError **)error { return NO; }
        - (void)showAlert:(NSString *)title message:(NSString *)msg {}
        @end
        EOF

    - name: Create Prefix Header
      run: |
        cat > SourceiosPrefix.pch << 'EOF'
        #ifndef SourceiosPrefix_pch
        #define SourceiosPrefix_pch

        #ifdef __OBJC__
        #import <Foundation/Foundation.h>
        #import <UIKit/UIKit.h>
        #import <Security/Security.h>
        #import <CoreGraphics/CoreGraphics.h>
        #endif

        #endif
        EOF

    # Sobrescreve SEMPRE main.m, AppDelegate.h e AppDelegate.m
    - name: Force Entry Point
      run: |
        cat > main.m << 'EOF'
        #import <UIKit/UIKit.h>
        #import "AppDelegate.h"

        int main(int argc, char * argv[]) {
            @autoreleasepool {
                return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
            }
        }
        EOF

        cat > AppDelegate.h << 'EOF'
        #import <UIKit/UIKit.h>

        @interface AppDelegate : UIResponder <UIApplicationDelegate>
        @property (strong, nonatomic) UIWindow *window;
        @end
        EOF

        cat > AppDelegate.m << 'EOF'
        #import "AppDelegate.h"
        #import "RootViewController.h"

        @implementation AppDelegate

        - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
            self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
            RootViewController *root = [[RootViewController alloc] init];
            UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:root];
            self.window.rootViewController = nav;
            [self.window makeKeyAndVisible];
            return YES;
        }

        @end
        EOF

        echo "=== main.m ==="
        cat main.m
        echo "=== AppDelegate.m ==="
        cat AppDelegate.m

    - name: Generate Xcode Project
      run: |
        HEADER_PATHS=$(find . -name "*.h" -not -path "./.git/*" -exec dirname {} \; | sort -u | tr '\n' ' ')
        
        cat > project.yml << EOF
        name: Sourceios
        options:
          bundleIdPrefix: com.sourceios
          deploymentTarget:
            iOS: "14.0"
        settings:
          base:
            CLANG_ENABLE_OBJC_ARC: YES
            CLANG_ENABLE_OBJC_WEAK: YES
            GENERATE_INFOPLIST_FILE: YES
            INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
            INFOPLIST_KEY_UILaunchScreen_Generation: YES
            OTHER_LDFLAGS: "-framework Security -framework UIKit -framework IOKit -framework CoreGraphics"
            HEADER_SEARCH_PATHS: "\$(SRCROOT) $HEADER_PATHS"
            GCC_PREFIX_HEADER: "\$(SRCROOT)/SourceiosPrefix.pch"
            GCC_PRECOMPILE_PREFIX_HEADER: YES
            CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: NO
            CLANG_WARN_UNDECLARED_SELECTOR: NO
        targets:
          Sourceios:
            type: application
            platform: iOS
            sources:
              - path: .
                excludes:
                  - ".github/**"
                  - ".git/**"
                  - "README.md"
                  - "project.yml"
                  - "SourceiosPrefix.pch"
                  - "Payloads/**"
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.sourceios.app
        EOF

        xcodegen generate

    - name: Build and Archive
      run: |
        xcodebuild archive \
          -project Sourceios.xcodeproj \
          -scheme Sourceios \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $PWD/build/Sourceios.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_ENTITLEMENTS="" \
          CLANG_ENABLE_OBJC_ARC=YES \
          CLANG_ENABLE_OBJC_WEAK=YES \
          ALWAYS_SEARCH_USER_PATHS=NO \
          OTHER_LDFLAGS="-framework Security -framework UIKit -framework IOKit -framework CoreGraphics" \
          GENERATE_INFOPLIST_FILE=YES \
          INFOPLIST_KEY_UIApplicationSceneManifest_Generation=NO \
          PRODUCT_BUNDLE_IDENTIFIER="com.sourceios.app" \
          IPHONEOS_DEPLOYMENT_TARGET="14.0" \
          GCC_PREFIX_HEADER="$PWD/SourceiosPrefix.pch" \
          GCC_PRECOMPILE_PREFIX_HEADER=YES

    - name: Create Unsigned IPA
      run: |
        mkdir -p Payload
        cp -R build/Sourceios.xcarchive/Products/Applications/Sourceios.app Payload/
        zip -r Sourceios-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sourceios-unsigned-ipa
        path: Sourceios-unsigned.ipa
